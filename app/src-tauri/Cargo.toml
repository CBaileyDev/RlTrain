[package]
name = "rl-studio"
version = "0.1.0"
description = "RL Studio — a desktop workbench for learning reinforcement learning by training Rocket League bots."
authors = ["RL Studio"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# Tauri v2 splits the app into a library plus a thin binary so the same code can be
# reused by the mobile targets and by integration tests. `staticlib`/`cdylib` are what
# those targets link against; `rlib` is what src/main.rs links against.
name = "rl_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The engine bridge is a long-lived WebSocket plus a child process, so the backend needs
# a real async runtime with process and timer support, not just Tauri's own.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }

# The assistant's API key belongs in the OS credential vault, never in the settings file.
# keyring 3 ships with NO backend unless a platform feature is enabled, so each OS
# selects its own below (a missing feature silently stores nothing).
keyring = { version = "3", default-features = false }

# rustls rather than native-tls: it removes the OpenSSL build dependency entirely, which
# matters because this project already has a heavy C++ toolchain to keep working.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (KWallet on KDE, GNOME Keyring elsewhere) via D-Bus, with rustls so no OpenSSL is needed.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
# A portfolio desktop app benefits far more from a small, fast binary than from fast
# release builds, and these only cost time on `cargo build --release`.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
